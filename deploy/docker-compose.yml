# 生产发布用的编排文件。
#
# 它期望运行在"发布包目录"里，目录结构由 CI 组装：
#   .
#   ├─ docker-compose.yml   （本文件）
#   ├─ Dockerfile
#   ├─ .env                 （密钥，首次发布后挪到 /srv/study/shared/.env）
#   ├─ backend/{auth,conn,gateway}-service.jar
#   ├─ web/                 （frontend/dist 内容）
#   ├─ nginx/nginx.conf
#   └─ init/01-schema.sql
#
# 端口策略：只有 web 对外发布端口，MySQL / Nacos / 三个后端服务都只存在于
# compose 内网，外部无法直连 —— 这也是"业务服务只信任网关"的落地方式。
#
# 内存提示：完整栈建议 4G 以上；2G 机器请把 Nacos 换成外部实例，
# 或者用 local profile 起服务、不要 Nacos。

name: conn-platform

services:
  mysql:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.4}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中配置}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nacos:
    image: ${NACOS_IMAGE:-docker.m.daocloud.io/nacos/nacos-server:v2.5.1}
    restart: unless-stopped
    environment:
      MODE: standalone
      # 只在 compose 内网可达、未发布端口，因此默认关闭鉴权。
      # 若把控制台暴露出去，务必改成 true 并配置账号密码。
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

  redis:
    # 鉴权关键路径：存访问令牌吊销名单 + 登录限流计数。
    # 和 MySQL/Nacos 一样只在 compose 内网可达、不发布端口，因此默认不设密码。
    # 若要把 Redis 暴露出去，请打开 requirepass 并配置 REDIS_PASSWORD。
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    # 批量导出队列。只在 compose 内网可达，不发布端口。
    # 不想额外养一个 Kafka，把 conn-service 的 EXPORT_QUEUE_TYPE 改成 redis 即可
    # （Redis Streams 同样支持消费组与至少一次投递）；记得同时去掉 conn-service
    # 的 depends_on.kafka，否则它仍会等 Kafka 健康。
    image: ${KAFKA_IMAGE:-docker.m.daocloud.io/apache/kafka:3.9.0}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 容器之间要用服务名连，不能用 localhost
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms256m}
      TZ: Asia/Shanghai
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
        BASE_IMAGE: ${BASE_IMAGE:-eclipse-temurin:21-jre}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: platform
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 中配置}
      NACOS_ADDR: nacos:8848
      APP_JWT_SECRET: ${APP_JWT_SECRET:?必须在 .env 中配置}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?必须在 .env 中配置}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?必须在 .env 中配置}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      # 用 bash 的内建 TCP 能力探活，避免依赖镜像里是否装了 curl/wget
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  conn-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: conn-service
        BASE_IMAGE: ${BASE_IMAGE:-eclipse-temurin:21-jre}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: platform
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 中配置}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP: kafka:9092
      EXPORT_QUEUE_TYPE: ${EXPORT_QUEUE_TYPE:-kafka}
      NACOS_ADDR: nacos:8848
      APP_JWT_SECRET: ${APP_JWT_SECRET:?必须在 .env 中配置}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?必须在 .env 中配置}
      # 一旦上线就不要更换，换掉之后已保存的连接密码将无法解密
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:?必须在 .env 中配置}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway-service
        BASE_IMAGE: ${BASE_IMAGE:-eclipse-temurin:21-jre}
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NACOS_ADDR: nacos:8848
      APP_JWT_SECRET: ${APP_JWT_SECRET:?必须在 .env 中配置}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?必须在 .env 中配置}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      gateway-service:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mysql-data:
  nacos-data:
  nacos-logs:
  redis-data:
  kafka-data:
