# 由仓库 deploy/nginx-study.conf 安装到 /etc/nginx/sites-available/study
server {
    listen 80;
    listen [::]:80;

    # 还没有域名，先接受任意 Host；绑域名后改成 server_name your.domain.com;
    server_name _;

    # 前端静态文件指向当前发布版本，切版本即整体生效
    root /srv/study/current/web;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    # 访问日志
    access_log /var/log/nginx/study.access.log;
    error_log  /var/log/nginx/study.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端单页应用：找不到文件就回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 健康检查透传给后端
    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }
}
