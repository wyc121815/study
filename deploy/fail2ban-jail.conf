# fail2ban 配置：SSH 防爆破
# 由仓库 deploy/fail2ban-jail.conf 安装到 /etc/fail2ban/jail.d/study-sshd.local
#
# 注意：不要命名为 *.local —— 项目 .gitignore 里有 Vite 用的 *.local 规则会把它忽略掉。

[DEFAULT]
# 白名单：回环地址 + 当前常用出口 IP，避免把自己封在门外
# 换了网络记得把新 IP 加进来（用 fail2ban-client set sshd unbanip <ip> 可手动解封）
ignoreip = 127.0.0.1/8 ::1 223.104.79.249

# 服务器是 Ubuntu 24.04+，sshd 日志走 systemd journal
backend  = systemd

# 10 分钟内失败 5 次就封 1 小时
findtime = 10m
maxretry = 5
bantime  = 1h

[sshd]
enabled = true
port    = ssh

# 累犯：一天内被反复封禁 3 次以上的，直接封一周
[recidive]
enabled  = true
findtime = 1d
maxretry = 3
bantime  = 1w
