server:
  port: 8080

spring:
  application:
    name: backend
  jackson:
    default-property-inclusion: non_null

# 前端开发服务器地址,用于放开跨域
app:
  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.example.backend: debug

