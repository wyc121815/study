server:
  port: 8082

spring:
  application:
    name: conn-service
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/platform_conn?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: ${MYSQL_USER:platform}
    password: ${MYSQL_PASSWORD:platform123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      pool-name: conn-pool
  jpa:
    hibernate:
      # 表结构由 deploy/mysql/init 维护，应用只读不建表
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:}
      discovery:
        enabled: ${NACOS_ENABLED:true}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Redis 只用来加速，超时给短一点，抖动时快速降级为直接查库
      timeout: 1s
      connect-timeout: 1s

app:
  jwt:
    secret: ${APP_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
    ttl-minutes: 30
    issuer: conn-platform
  internal:
    # 与网关保持一致；业务服务据此判断身份头是否可信
    secret: ${APP_INTERNAL_SECRET:dev-internal-secret-change-me}
  # 仅本地开发用的默认密钥，生产必须用 APP_CRYPTO_KEY 覆盖
  crypto:
    key: ${APP_CRYPTO_KEY:Y29ubi1wbGF0Zm9ybS1kZXYtYWVzLWtleS0zMmJ5dGU=}
  connection:
    test-timeout-seconds: ${CONN_TEST_TIMEOUT:10}
  query:
    # SQL 执行：默认最多返回 1000 行，硬上限 5000 行，单条语句最多跑 30 秒
    max-rows: ${QUERY_MAX_ROWS:1000}
    max-rows-limit: ${QUERY_MAX_ROWS_LIMIT:5000}
    timeout-seconds: ${QUERY_TIMEOUT:30}
    # 默认只读：只放行 SELECT/SHOW/DESCRIBE/EXPLAIN 等；确认需要写操作再改 true
    allow-write: ${QUERY_ALLOW_WRITE:false}
    # 指标结果缓存时长（秒）；设为 0 关闭缓存
    cache-seconds: ${QUERY_CACHE_SECONDS:300}
    # 执行层并发控制：每实例工作线程数 + 排队上限，排满直接拒绝，不无限堆积
    worker-threads: ${QUERY_WORKER_THREADS:8}
    queue-capacity: ${QUERY_QUEUE_CAPACITY:100}
    # 单个数据源的并发查询上限：存在 Redis 里，多实例共享同一个额度
    per-datasource-concurrency: ${QUERY_DATASOURCE_CONCURRENCY:4}
    # 抢不到数据源额度时最多等多久，等不到就 429
    datasource-acquire-wait-ms: ${QUERY_DATASOURCE_ACQUIRE_WAIT_MS:2000}
    # 缓存击穿保护：抢到锁的实例去查库，其他实例最多等这么久
    single-flight-wait-ms: ${QUERY_SINGLEFLIGHT_WAIT_MS:1500}
    single-flight-lock-seconds: ${QUERY_SINGLEFLIGHT_LOCK_SECONDS:35}
  export:
    queue:
      # redis = Redis Streams（默认，随平台一起就有）；kafka = 需要额外部署 broker
      type: ${EXPORT_QUEUE_TYPE:redis}
      stream: ${EXPORT_STREAM:query:export:tasks}
      topic: ${EXPORT_TOPIC:query-export-tasks}
      consumer-group: ${EXPORT_CONSUMER_GROUP:conn-service-export}
      # 卡在 RUNNING 超过这个时间的任务会被重新投递
      stuck-minutes: ${EXPORT_STUCK_MINUTES:5}
    # 导出结果保留时长（分钟），过期由定时任务清理
    ttl-minutes: ${EXPORT_TTL_MINUTES:120}
    # 关掉就直接同步导出（Kafka/Redis 都不可用时也能工作）
    async-enabled: ${EXPORT_ASYNC_ENABLED:true}
  demo:
    # 首次启动时创建演示数据源与演示指标（幂等）；生产可设 APP_DEMO_ENABLED=false 关闭
    enabled: ${APP_DEMO_ENABLED:true}
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    consumer:
      group-id: ${EXPORT_CONSUMER_GROUP:conn-service-export}
      auto-offset-reset: earliest
    listener:
      concurrency: ${EXPORT_CONSUMER_CONCURRENCY:2}
  clients:
    # 留空 = 走注册中心 + 负载均衡；本地模式填 http://localhost:8081
    auth-service-url: ${AUTH_SERVICE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.example.platform: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

---
# 本地模式：不注册到 Nacos，直接通过固定地址调用 auth-service
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false

app:
  clients:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
