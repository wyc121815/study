name: Deploy

# 服务器（2C2G）目前没装 Docker，整栈跑不起来。而 release.sh 是"先切 current
# 软链、再拉容器"，部署失败会留下指向不完整版本的软链——线上 nginx 的 root 就是
# /srv/study/current/web，会立刻变成"新前端打旧后端"。
# 因此暂时关掉自动触发，只保留手动执行（Actions 页面点 Run workflow）。
# 服务器就绪后把下面两行注释还原即可恢复"推 main 自动发布"：
#   push:
#     branches: [main]
on:
  workflow_dispatch:

# 同一时间只允许一个部署在跑，避免两个版本同时切软链
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVER_HOST: 101.43.12.14
  SERVER_USER: deploy
  HTTP_PORT: '80'

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 构建后端（含单元测试）
        run: ./mvnw -B clean package

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 组装发布包
        run: |
          # 注意：upload-artifact 默认不上传隐藏目录，所以不能用点开头的目录名
          mkdir -p staging/backend staging/web staging/nginx staging/init
          for module in auth-service conn-service gateway-service; do
            cp "$module/target/$module-0.0.1-SNAPSHOT.jar" "staging/backend/$module.jar"
          done
          cp -r frontend/dist/. staging/web/
          cp deploy/docker-compose.yml deploy/Dockerfile staging/
          cp deploy/nginx/nginx.conf staging/nginx/
          cp deploy/mysql/init/01-schema.sql staging/init/
          ls -la staging staging/backend staging/web

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: staging
          # 产物为空时直接失败，避免"上传成功但内容为空"这种静默错误
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: 发布到服务器
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: 生成服务器端密钥文件
        run: |
          cat > app/.env <<EOF
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          APP_JWT_SECRET=${{ secrets.APP_JWT_SECRET }}
          APP_CRYPTO_KEY=${{ secrets.APP_CRYPTO_KEY }}
          APP_INTERNAL_SECRET=${{ secrets.APP_INTERNAL_SECRET }}
          APP_ADMIN_USERNAME=${{ vars.APP_ADMIN_USERNAME || 'admin' }}
          APP_ADMIN_PASSWORD=${{ secrets.APP_ADMIN_PASSWORD }}
          HTTP_PORT=${HTTP_PORT}
          EOF
          chmod 600 app/.env

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 上传发布包
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          echo "RELEASE=$TS" >> "$GITHUB_ENV"
          tar czf /tmp/release.tgz -C app .
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          scp $SSH_OPTS /tmp/release.tgz "$SERVER_USER@$SERVER_HOST:/tmp/study-release.tgz"
          scp $SSH_OPTS deploy/release.sh "$SERVER_USER@$SERVER_HOST:/tmp/study-release.sh"

      - name: 切换版本并重启（失败自动回滚）
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" "
            set -e
            sed -i 's/\r\$//' /tmp/study-release.sh
            REL=/srv/study/releases/$RELEASE
            mkdir -p \$REL
            tar xzf /tmp/study-release.tgz -C \$REL
            rm -f /tmp/study-release.tgz
            bash /tmp/study-release.sh $RELEASE $HTTP_PORT
          "

      - name: 外网健康检查
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "http://$SERVER_HOST:$HTTP_PORT/health"; then
              echo "外网健康检查通过"
              exit 0
            fi
            sleep 3
          done
          echo "外网健康检查失败"
          exit 1
